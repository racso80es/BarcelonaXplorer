# Manifiesto de Activos de Runtime del Standalone
# Gobernanza de Activos: AUD-OPS-DEPLOY-002, Fricción 4. Axioma V (Ejecución Encapsulada).
assets:
  - source: "features/context-sources/context-sources.seed.yml"
    destination: "features/context-sources/context-sources.seed.yml"

# Ficheros YAML de configuración u oráculos que no son activos leídos en runtime por el runner
ignore:
  - "docker-runtime-assets.yml"

