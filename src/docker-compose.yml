# ═══════════════════════════════════════════════════════════════
# Orquestación de Servicios: BarcelonaXplorer (Producción)
# Marco Constitucional: Protocolo de Acero — Grado S+
# Axioma I: Localidad de Comportamiento — Stack completo orquestado
# Axioma II: Tolerancia Cero a la Inferencia — Mapeos y vars explícitas
# Axioma III: Diseño Declarativo sobre Lógica Imperativa
# ═══════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────
  # Servicio Web: PWA Next.js 16 (App Router + Standalone Output)
  # ─────────────────────────────────────────────────────────────
  web:
    # Axioma II: etiqueta inmutable por release (PBI-STEEL-008) — BX_RELEASE_TAG en hook Ansistrano
    image: barcelonaxplorer-web:${BX_RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barcelonaxplorer_web
    # Axioma III: Publicación declarativa de puertos (8080 host -> 3000 contenedor)
    ports:
      - "8080:3000"
    restart: unless-stopped
    # Inyección de secretos segregados por servicio desde shared (PBI-GW-014)
    env_file: .env.web
    environment:
      - NODE_ENV=production
      - TELEGRAM_ENABLED=true
      - TELEGRAM_WEBHOOK_URL=https://barcelonaxplorer.com/api/telegram/webhook
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      # Estabilización de resolución DNS en Node.js (prioridad IPv4 para APIs externas)
      - NODE_OPTIONS=--dns-result-order=ipv4first
      # Persistencia Vectorial LanceDB: URI in-process sobre almacenamiento persistente
      - LANCEDB_URI=${LANCEDB_URI:-/app/vector_storage}
      # Aduana Universal IA Gateway (HU-16)
      - IA_GATEWAY_URL=${IA_GATEWAY_URL:-http://ia-gateway:3001}
      - IA_GATEWAY_SECRET=${IA_GATEWAY_SECRET}
    volumes:
      # Axioma I: Aislamiento IaaC del almacenamiento vectorial LanceDB (Apache Arrow)
      - ${LANCEDB_DATA_PATH:-./data/lancedb}:/app/vector_storage
    depends_on:
      - db
      - ia-gateway

  # ─────────────────────────────────────────────────────────────
  # Servicio IA Gateway: Microservicio Aduana Universal Multi-Motor
  # ─────────────────────────────────────────────────────────────
  ia-gateway:
    image: barcelonaxplorer-ia-gateway:${BX_RELEASE_TAG:-local}
    build:
      context: ./ia-gateway
      dockerfile: Dockerfile
    container_name: barcelonaxplorer_ia_gateway
    restart: unless-stopped
    env_file: .env.ia-gateway
    environment:
      - NODE_ENV=production
    # Axioma I: Sin puertos publicados en el host (solo alcanzable por la red interna de docker compose)
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ─────────────────────────────────────────────────────────────
  # Servicio DB: Motor Relacional MySQL 8.0 (Telemetría y Anclajes)
  # ─────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: barcelonaxplorer_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # Axioma I: Persistencia de datos transaccionales fuera del ciclo de vida del release
      - /home/racso/Despliegues/BarcelonaXplorer/mysql_data:/var/lib/mysql
    # Enlace restringido a interfaz de loopback para acceso seguro en host
    ports:
      - "127.0.0.1:3306:3306"

