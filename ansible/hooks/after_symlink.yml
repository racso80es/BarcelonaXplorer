---
# ═══════════════════════════════════════════════════════════════
# Hook Ansistrano: After Symlink (Ignición y Estabilización)
# Marco Constitucional: Protocolo de Acero — Grado S+
# Axioma I: Localidad de Comportamiento — Ejecución contextual en current
# Axioma II: Tolerancia Cero a la Inferencia — Sondeos estrictos de salud
# Axioma III: Diseño Declarativo sobre Lógica Imperativa
# Axioma IV: El Peaje del Oráculo — Bloqueo preventivo ante fallas
# ═══════════════════════════════════════════════════════════════

# Axioma V: Ejecución Encapsulada y Aislamiento de Fallos (Build-Before-Swap)
# Paso 1: Etiquetar release, compilar imagen inmutable y conservar al menos 2 tags (PBI-STEEL-008)
- name: Registrar etiqueta de release y compilar imágenes ia-gateway y web etiquetadas (Build-Before-Swap)
  ansible.builtin.shell: |
    set -euo pipefail
    export BX_RELEASE_TAG="{{ ansistrano_release_path | basename }}"
    echo "$BX_RELEASE_TAG" > .bx_release_tag
    ENV_FILE="$([ -f .env.web ] && echo '.env.web' || echo '.env.production')"
    docker compose --env-file "$ENV_FILE" -p barcelonaxplorer build ia-gateway web
  args:
    chdir: "{{ ansistrano_deploy_to }}/current"
    executable: /bin/bash
  environment:
    BX_RELEASE_TAG: "{{ ansistrano_release_path | basename }}"

# Axioma III: Convergencia declarativa sin derribo destructivo previo (Zero-Downtime)
# Paso 2: Sustituir de forma atómica y transparente únicamente los contenedores cuya imagen ha cambiado
- name: Orquestar convergencia declarativa de contenedores Zero-Downtime
  ansible.builtin.shell: |
    set -euo pipefail
    export BX_RELEASE_TAG="$(cat .bx_release_tag)"
    ENV_FILE="$([ -f .env.web ] && echo '.env.web' || echo '.env.production')"
    docker compose --env-file "$ENV_FILE" -p barcelonaxplorer up -d --remove-orphans
  args:
    chdir: "{{ ansistrano_deploy_to }}/current"
    executable: /bin/bash

# Axioma II: Ventana de estabilización temporal para apertura de sockets TCP/InnoDB
- name: Pausa táctica para ignición y estabilización del socket InnoDB (MySQL)
  ansible.builtin.pause:
    seconds: 5
    prompt: "Aguardando estabilización del socket de InnoDB en el Nodo 11..."

# Axioma IV: Oráculo de disponibilidad — Sondeo activo mysqladmin con reintentos acotados
- name: Esperar a que el motor MySQL esté saludable
  ansible.builtin.shell: |
    set -euo pipefail
    set -a
    # shellcheck disable=SC1091
    source "$([ -f .env.web ] && echo '.env.web' || echo '.env.production')"
    set +a
    docker exec barcelonaxplorer_mysql mysqladmin ping -h localhost -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent
  args:
    chdir: "{{ ansistrano_deploy_to }}/current"
    executable: /bin/bash
  register: mysql_ping
  until: mysql_ping.rc == 0
  retries: 20
  delay: 2
  changed_when: false

# Axioma I: Migración DDL idempotente ejecutada in-situ para garantizar consistencia relacional
- name: Sincronizar esquemas de MySQL (SystemConfig, TelemetryLog, user_anchors, magic_link_nonces, tactical_itineraries, context_sources)
  ansible.builtin.shell: |
    set -euo pipefail
    set -a
    # shellcheck disable=SC1091
    source "$([ -f .env.web ] && echo '.env.web' || echo '.env.production')"
    set +a
    docker exec -i barcelonaxplorer_mysql mysql -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" "${MYSQL_DATABASE}" << 'EOF'
    CREATE TABLE IF NOT EXISTS `SystemConfig` (
        `id` INTEGER NOT NULL AUTO_INCREMENT,
        `key` VARCHAR(191) NOT NULL,
        `value` VARCHAR(191) NOT NULL,
        `updatedAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
        UNIQUE INDEX `SystemConfig_key_key`(`key`),
        PRIMARY KEY (`id`)
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS `TelemetryLog` (
        `id` VARCHAR(191) NOT NULL,
        `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
        `level` ENUM('DEBUG', 'INFO', 'WARN', 'ERROR') NOT NULL,
        `context` ENUM('CLIENT_UI', 'SERVER_API', 'LLM_ENGINE', 'SYSTEM', 'SECURITY_PERIMETER') NOT NULL,
        `message` VARCHAR(512) NOT NULL,
        `payload` JSON NULL,
        `statusCode` INTEGER NULL,
        `durationMs` INTEGER NULL,
        `environment` VARCHAR(32) NOT NULL DEFAULT 'production',

        INDEX `TelemetryLog_context_level_createdAt_idx`(`context`, `level`, `createdAt`),
        INDEX `TelemetryLog_createdAt_idx`(`createdAt`),
        INDEX `TelemetryLog_level_idx`(`level`),
        PRIMARY KEY (`id`)
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS `user_anchors` (
        `id` VARCHAR(191) NOT NULL,
        `sessionId` VARCHAR(64) NOT NULL,
        `telegramChatId` VARCHAR(64) NOT NULL,
        `telegramUsername` VARCHAR(128) NULL,
        `firstName` VARCHAR(128) NULL,
        `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
        `updatedAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
        `lastInteractionAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),

        UNIQUE INDEX `user_anchors_telegramChatId_key`(`telegramChatId`),
        INDEX `user_anchors_sessionId_idx`(`sessionId`),
        INDEX `user_anchors_telegramChatId_idx`(`telegramChatId`),
        PRIMARY KEY (`id`)
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS `magic_link_nonces` (
        `id` VARCHAR(191) NOT NULL,
        `tokenHash` VARCHAR(64) NOT NULL,
        `sessionId` VARCHAR(64) NOT NULL,
        `expiresAt` DATETIME(3) NOT NULL,
        `consumedAt` DATETIME(3) NULL,
        `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),

        UNIQUE INDEX `magic_link_nonces_tokenHash_key`(`tokenHash`),
        INDEX `magic_link_nonces_tokenHash_expiresAt_idx`(`tokenHash`, `expiresAt`),
        PRIMARY KEY (`id`)
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS `tactical_itineraries` (
        `id` VARCHAR(191) NOT NULL,
        `sessionId` VARCHAR(64) NOT NULL,
        `summary` VARCHAR(512) NOT NULL,
        `status` VARCHAR(32) NOT NULL DEFAULT 'ACTIVE',
        `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
        `updatedAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),

        INDEX `tactical_itineraries_sessionId_idx`(`sessionId`),
        PRIMARY KEY (`id`)
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS `tactical_itinerary_nodes` (
        `id` VARCHAR(191) NOT NULL,
        `itineraryId` VARCHAR(191) NOT NULL,
        `title` VARCHAR(255) NOT NULL,
        `description` TEXT NOT NULL,
        `category` VARCHAR(64) NOT NULL DEFAULT 'GENERAL',
        `startTime` VARCHAR(8) NOT NULL,
        `endTime` VARCHAR(8) NULL,
        `orderIndex` INTEGER NOT NULL DEFAULT 0,
        `coordinatesLat` DOUBLE NULL,
        `coordinatesLng` DOUBLE NULL,
        `affiliateProvider` VARCHAR(32) NULL,
        `affiliateUrl` VARCHAR(512) NULL,
        `isSelected` BOOLEAN NOT NULL DEFAULT true,
        `options` JSON NULL,
        `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
        `updatedAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),

        INDEX `tactical_itinerary_nodes_itineraryId_orderIndex_idx`(`itineraryId`, `orderIndex`),
        PRIMARY KEY (`id`),
        CONSTRAINT `tactical_itinerary_nodes_itineraryId_fkey` FOREIGN KEY (`itineraryId`) REFERENCES `tactical_itineraries` (`id`) ON DELETE CASCADE ON UPDATE CASCADE
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS `context_sources` (
        `id` VARCHAR(191) NOT NULL,
        `sourceTag` VARCHAR(64) NOT NULL,
        `displayName` VARCHAR(191) NOT NULL,
        `endpoint` VARCHAR(2048) NOT NULL,
        `type` ENUM('API_REST', 'SOCRATA', 'JSON_LD', 'ICAL', 'RSS', 'SPARQL') NOT NULL,
        `category` VARCHAR(64) NOT NULL,
        `status` ENUM('ACTIVE', 'DEGRADED', 'PENDING_APPROVAL', 'INACTIVE') NOT NULL DEFAULT 'PENDING_APPROVAL',
        `failedAttempts` INTEGER NOT NULL DEFAULT 0,
        `lastSuccessAt` DATETIME(3) NULL,
        `lastErrorAt` DATETIME(3) NULL,
        `lastError` VARCHAR(512) NULL,
        `proposedBy` VARCHAR(32) NOT NULL DEFAULT 'SEED',
        `supersedesSourceTag` VARCHAR(64) NULL,
        `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
        `updatedAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),

        UNIQUE INDEX `context_sources_sourceTag_key`(`sourceTag`),
        INDEX `context_sources_status_idx`(`status`),
        PRIMARY KEY (`id`)
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    EOF
  args:
    chdir: "{{ ansistrano_deploy_to }}/current"
    executable: /bin/bash

# Axioma IV: El Peaje del Oráculo — Sonda sintética post-despliegue con reversión automática
- name: Oráculo de Salud Sintético y Mitigación Automática Post-Despliegue
  block:
    # CA-1 (PBI-GW-013): Verificar que el contenedor barcelonaxplorer_ia_gateway alcance estado healthy
    - name: Verificar salud del contenedor IA Gateway vía Docker Healthcheck
      ansible.builtin.command: docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' barcelonaxplorer_ia_gateway
      register: ia_gateway_container_health
      until: ia_gateway_container_health.stdout == 'healthy'
      retries: 20
      delay: 2
      changed_when: false

    - name: Sondear salud de la aplicación Next.js vía endpoint de telemetría sintética
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/api/telemetry/log"
        method: POST
        body_format: json
        body:
          level: "INFO"
          context: "SYSTEM"
          message: "Oráculo de salud sintético post-despliegue Ansistrano"
          payload:
            source: "ansistrano_health_oracle"
          statusCode: 200
          environment: "production"
        status_code:
          - 200
          - 202
        return_content: true
      register: healthcheck_probe
      until: healthcheck_probe.status in [200, 202] and (healthcheck_probe.json.status == 'accepted' or healthcheck_probe.status == 200)
      retries: 10
      delay: 3

    # CA-3 (PBI-GW-013): Sonda HTTP end-to-end a través del monolito al IA Gateway
    - name: Sondear salud end-to-end del IA Gateway vía endpoint /api/ai/health
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/api/ai/health"
        method: GET
        status_code: 200
        return_content: true
      register: ia_gateway_probe
      until: ia_gateway_probe.status == 200 and ia_gateway_probe.json.success == true
      retries: 10
      delay: 3

    - name: Confirmar éxito del Oráculo de Salud Sintético
      ansible.builtin.debug:
        msg: >
          Oráculo de salud superado exitosamente.
          Telemetría Next.js: {{ healthcheck_probe.status }}.
          IA Gateway contenedor: {{ ia_gateway_container_health.stdout }} | Sonda HTTP: {{ ia_gateway_probe.status }}.
          Stack Next.js + IA Gateway + MySQL 100% operativo en release activa.

    - name: Registrar acta de despliegue exitoso
      ansible.builtin.copy:
        dest: "{{ ansistrano_deploy_to }}/shared/last-deploy-outcome.yml"
        content: |
          outcome: succeeded
          release_path: "{{ ansistrano_release_path }}"
          release_tag: "{{ ansistrano_release_path | basename }}"
          failed_task: ""
          finished_at: "{{ now(fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          playbook: "deploy.yml"

  rescue:
    - name: Alerta crítica — El Oráculo de Salud detectó fallo persistente post-despliegue
      ansible.builtin.debug:
        msg: "CRITICAL: La nueva release no responde satisfactoriamente tras 10 intentos. Iniciando reversión determinista automatizada..."

    - name: Conmutar symlink current a la release anterior y restaurar imagen etiquetada
      ansible.builtin.shell: |
        set -euo pipefail
        PREV_RELEASE=$(ls -1td {{ ansistrano_deploy_to }}/releases/* | sed -n '2p')
        if [ -n "$PREV_RELEASE" ] && [ -d "$PREV_RELEASE" ]; then
          echo "Revirtiendo symlink current a release previa: $PREV_RELEASE"
          ln -sfn "$PREV_RELEASE" {{ ansistrano_deploy_to }}/current
          cd {{ ansistrano_deploy_to }}/current
          if [ ! -f .bx_release_tag ]; then
            echo "ADVERTENCIA: release previa sin .bx_release_tag; abortando rescate determinista."
            exit 1
          fi
          export BX_RELEASE_TAG="$(cat .bx_release_tag)"
          ENV_FILE="$([ -f .env.web ] && echo '.env.web' || echo '.env.production')"
          if ! docker image inspect "barcelonaxplorer-web:${BX_RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Imagen ${BX_RELEASE_TAG} ausente; reconstruyendo desde release previa..."
            docker compose --env-file "$ENV_FILE" -p barcelonaxplorer build web
          fi
          docker compose --env-file "$ENV_FILE" -p barcelonaxplorer up -d --remove-orphans
          echo "BX_RESTORED_RELEASE=$PREV_RELEASE" > {{ ansistrano_deploy_to }}/shared/.bx_restored_info
          echo "BX_RESTORED_TAG=$BX_RELEASE_TAG" >> {{ ansistrano_deploy_to }}/shared/.bx_restored_info
        else
          echo "ADVERTENCIA: No se localizó release previa para restaurar."
          echo "BX_RESTORED_RELEASE=none" > {{ ansistrano_deploy_to }}/shared/.bx_restored_info
          echo "BX_RESTORED_TAG=none" >> {{ ansistrano_deploy_to }}/shared/.bx_restored_info
        fi
      args:
        executable: /bin/bash
      changed_when: true

    - name: Leer información de la release restaurada
      ansible.builtin.shell: cat {{ ansistrano_deploy_to }}/shared/.bx_restored_info
      register: restored_info_raw
      changed_when: false

    - name: Parsear release restaurada
      ansible.builtin.set_fact:
        restored_release: "{{ restored_info_raw.stdout | regex_search('BX_RESTORED_RELEASE=(.*)', '\\1') | first }}"
        restored_tag: "{{ restored_info_raw.stdout | regex_search('BX_RESTORED_TAG=(.*)', '\\1') | first }}"

    - name: Registrar acta de despliegue revertido
      ansible.builtin.copy:
        dest: "{{ ansistrano_deploy_to }}/shared/last-deploy-outcome.yml"
        content: |
          outcome: rolled_back
          release_path: "{{ restored_release }}"
          release_tag: "{{ restored_tag }}"
          failed_task: "{{ ansible_failed_task.name | default('desconocida') }}"
          finished_at: "{{ now(fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          playbook: "deploy.yml"

    - name: Abortar despliegue por fallo del Oráculo de Salud
      ansible.builtin.fail:
        msg: >
          El despliegue fue revertido a la versión previa debido a que la tarea '{{ ansible_failed_task.name | default('desconocida') }}' falló.
          Detalle: {{ ansible_failed_result.msg | default('N/A') }}.
          Salud IA Gateway: {{ ia_gateway_container_health.stdout | default('N/A') }}.
          Release restaurada: {{ restored_release }}, Tag: {{ restored_tag }}.

