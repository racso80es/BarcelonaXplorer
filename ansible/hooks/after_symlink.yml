---
# ═══════════════════════════════════════════════════════════════
# Hook Ansistrano: After Symlink (Ignición y Estabilización)
# Marco Constitucional: Protocolo de Acero — Grado S+
# Axioma I: Localidad de Comportamiento — Ejecución contextual en current
# Axioma II: Tolerancia Cero a la Inferencia — Sondeos estrictos de salud
# Axioma III: Diseño Declarativo sobre Lógica Imperativa
# Axioma IV: El Peaje del Oráculo — Bloqueo preventivo ante fallas
# ═══════════════════════════════════════════════════════════════

# Axioma V: Ejecución Encapsulada y Aislamiento de Fallos (Build-Before-Swap)
# Paso 1: Compilar la imagen Docker de la aplicación web antes de alterar cualquier contenedor en ejecución
- name: Compilar imagen web de forma aislada previa a la sustitución (Build-Before-Swap)
  ansible.builtin.shell: docker compose --env-file .env.production -p barcelonaxplorer build web
  args:
    chdir: "{{ ansistrano_deploy_to }}/current"

# Axioma III: Convergencia declarativa sin derribo destructivo previo (Zero-Downtime)
# Paso 2: Sustituir de forma atómica y transparente únicamente los contenedores cuya imagen ha cambiado
- name: Orquestar convergencia declarativa de contenedores Zero-Downtime
  ansible.builtin.shell: docker compose --env-file .env.production -p barcelonaxplorer up -d --remove-orphans
  args:
    chdir: "{{ ansistrano_deploy_to }}/current"

# Axioma II: Ventana de estabilización temporal para apertura de sockets TCP/InnoDB
- name: Pausa táctica para ignición y estabilización del socket InnoDB (MySQL)
  ansible.builtin.pause:
    seconds: 5
    prompt: "Aguardando estabilización del socket de InnoDB en el Nodo 11..."

# Axioma IV: Oráculo de disponibilidad — Sondeo activo mysqladmin con reintentos acotados
- name: Esperar a que el motor MySQL esté saludable
  ansible.builtin.shell: docker exec barcelonaxplorer_mysql mysqladmin ping -h localhost -ubx_admin -pbx_secure_pass --silent
  register: mysql_ping
  until: mysql_ping.rc == 0
  retries: 20
  delay: 2
  changed_when: false

# Axioma I: Migración DDL idempotente ejecutada in-situ para garantizar consistencia relacional
- name: Sincronizar esquemas de MySQL (SystemConfig, TelemetryLog, user_anchors, magic_link_nonces, tactical_itineraries)
  ansible.builtin.shell: |
    docker exec -i barcelonaxplorer_mysql mysql -ubx_admin -pbx_secure_pass barcelonaxplorer_db << 'EOF'
    CREATE TABLE IF NOT EXISTS `SystemConfig` (
        `id` INTEGER NOT NULL AUTO_INCREMENT,
        `key` VARCHAR(191) NOT NULL,
        `value` VARCHAR(191) NOT NULL,
        `updatedAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
        UNIQUE INDEX `SystemConfig_key_key`(`key`),
        PRIMARY KEY (`id`)
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS `TelemetryLog` (
        `id` VARCHAR(191) NOT NULL,
        `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
        `level` ENUM('DEBUG', 'INFO', 'WARN', 'ERROR') NOT NULL,
        `context` ENUM('CLIENT_UI', 'SERVER_API', 'LLM_ENGINE', 'SYSTEM', 'SECURITY_PERIMETER') NOT NULL,
        `message` VARCHAR(512) NOT NULL,
        `payload` JSON NULL,
        `statusCode` INTEGER NULL,
        `durationMs` INTEGER NULL,
        `environment` VARCHAR(32) NOT NULL DEFAULT 'production',

        INDEX `TelemetryLog_context_level_createdAt_idx`(`context`, `level`, `createdAt`),
        INDEX `TelemetryLog_createdAt_idx`(`createdAt`),
        INDEX `TelemetryLog_level_idx`(`level`),
        PRIMARY KEY (`id`)
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS `user_anchors` (
        `id` VARCHAR(191) NOT NULL,
        `sessionId` VARCHAR(64) NOT NULL,
        `telegramChatId` VARCHAR(64) NOT NULL,
        `telegramUsername` VARCHAR(128) NULL,
        `firstName` VARCHAR(128) NULL,
        `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
        `updatedAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
        `lastInteractionAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),

        UNIQUE INDEX `user_anchors_telegramChatId_key`(`telegramChatId`),
        INDEX `user_anchors_sessionId_idx`(`sessionId`),
        INDEX `user_anchors_telegramChatId_idx`(`telegramChatId`),
        PRIMARY KEY (`id`)
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS `magic_link_nonces` (
        `id` VARCHAR(191) NOT NULL,
        `tokenHash` VARCHAR(64) NOT NULL,
        `sessionId` VARCHAR(64) NOT NULL,
        `expiresAt` DATETIME(3) NOT NULL,
        `consumedAt` DATETIME(3) NULL,
        `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),

        UNIQUE INDEX `magic_link_nonces_tokenHash_key`(`tokenHash`),
        INDEX `magic_link_nonces_tokenHash_expiresAt_idx`(`tokenHash`, `expiresAt`),
        PRIMARY KEY (`id`)
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS `tactical_itineraries` (
        `id` VARCHAR(191) NOT NULL,
        `sessionId` VARCHAR(64) NOT NULL,
        `summary` VARCHAR(512) NOT NULL,
        `status` VARCHAR(32) NOT NULL DEFAULT 'ACTIVE',
        `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
        `updatedAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),

        INDEX `tactical_itineraries_sessionId_idx`(`sessionId`),
        PRIMARY KEY (`id`)
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS `tactical_itinerary_nodes` (
        `id` VARCHAR(191) NOT NULL,
        `itineraryId` VARCHAR(191) NOT NULL,
        `title` VARCHAR(255) NOT NULL,
        `description` TEXT NOT NULL,
        `category` VARCHAR(64) NOT NULL DEFAULT 'GENERAL',
        `startTime` VARCHAR(8) NOT NULL,
        `endTime` VARCHAR(8) NULL,
        `orderIndex` INTEGER NOT NULL DEFAULT 0,
        `coordinatesLat` DOUBLE NULL,
        `coordinatesLng` DOUBLE NULL,
        `affiliateProvider` VARCHAR(32) NULL,
        `affiliateUrl` VARCHAR(512) NULL,
        `isSelected` BOOLEAN NOT NULL DEFAULT true,
        `options` JSON NULL,
        `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
        `updatedAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),

        INDEX `tactical_itinerary_nodes_itineraryId_orderIndex_idx`(`itineraryId`, `orderIndex`),
        PRIMARY KEY (`id`),
        CONSTRAINT `tactical_itinerary_nodes_itineraryId_fkey` FOREIGN KEY (`itineraryId`) REFERENCES `tactical_itineraries` (`id`) ON DELETE CASCADE ON UPDATE CASCADE
    ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    EOF

# Axioma IV: El Peaje del Oráculo — Sonda sintética post-despliegue con reversión automática
- name: Oráculo de Salud Sintético y Mitigación Automática Post-Despliegue
  block:
    - name: Sondear salud de la aplicación Next.js vía endpoint de telemetría sintética
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/api/telemetry/log"
        method: POST
        body_format: json
        body:
          level: "INFO"
          context: "SYSTEM"
          message: "Oráculo de salud sintético post-despliegue Ansistrano"
          payload:
            source: "ansistrano_health_oracle"
          statusCode: 200
          environment: "production"
        status_code:
          - 200
          - 202
        return_content: true
      register: healthcheck_probe
      until: healthcheck_probe.status in [200, 202] and (healthcheck_probe.json.status == 'accepted' or healthcheck_probe.status == 200)
      retries: 10
      delay: 3

    - name: Confirmar éxito del Oráculo de Salud Sintético
      ansible.builtin.debug:
        msg: >
          Oráculo de salud superado exitosamente. Estado HTTP: {{ healthcheck_probe.status }}.
          Stack Next.js + MySQL 100% operativo en release activa.

  rescue:
    - name: Alerta crítica — El Oráculo de Salud detectó fallo persistente post-despliegue
      ansible.builtin.debug:
        msg: "CRITICAL: La nueva release no responde satisfactoriamente tras 10 intentos. Iniciando reversión determinista automatizada..."

    - name: Conmutar symlink current a la release anterior y restaurar servicios
      ansible.builtin.shell: |
        PREV_RELEASE=$(ls -1td {{ ansistrano_deploy_to }}/releases/* | sed -n '2p')
        if [ -n "$PREV_RELEASE" ] && [ -d "$PREV_RELEASE" ]; then
          echo "Revirtiendo symlink current a release previa: $PREV_RELEASE"
          ln -sfn "$PREV_RELEASE" {{ ansistrano_deploy_to }}/current
          cd {{ ansistrano_deploy_to }}/current
          docker compose --env-file .env.production -p barcelonaxplorer up -d --remove-orphans
        else
          echo "ADVERTENCIA: No se localizó release previa para restaurar."
        fi
      changed_when: true

    - name: Abortar despliegue por fallo del Oráculo de Salud
      ansible.builtin.fail:
        msg: >
          El despliegue fue revertido a la versión previa debido a que el Oráculo de Salud
          no recibió una respuesta válida en http://127.0.0.1:8080/api/telemetry/log tras 10 reintentos.

